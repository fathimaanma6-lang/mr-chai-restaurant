<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Mr. Chai Restaurant</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../client/css/style.css" rel="stylesheet">
</head>
<body style="background-color: var(--chai-brown); min-height: 100vh; display: flex; align-items: center;">

<div class="container">
  <div class="auth-panel" style="margin: 0 auto;">
    <div class="text-center mb-4">
      <img src="../client/images/logo-full.png" alt="Mr. Chai" style="height:120px; margin-bottom: 0.5rem;">
      <p class="section-eyebrow mb-0">Admin panel</p>
    </div>

    <form id="adminLoginForm">
      <div class="mb-3">
        <label class="form-label small fw-semibold">Email</label>
        <input type="email" class="form-control chai-form-control" id="email" required placeholder="admin@mrchai.com">
      </div>
      <div class="mb-4">
        <label class="form-label small fw-semibold">Password</label>
        <input type="password" class="form-control chai-form-control" id="password" required placeholder="••••••••">
      </div>
      <div id="loginError" class="alert alert-danger py-2 small" style="display:none;"></div>
      <button type="submit" class="btn btn-chai-primary w-100" id="loginBtn">Sign in</button>
    </form>

    <p class="text-center small text-muted mt-4 mb-0">
      Not an admin? <a href="../client/index.html">Go to the customer site</a>
    </p>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/admin-api.js"></script>
<script>
  // If already logged in, skip straight to the dashboard
  if (isAdminLoggedIn()) {
    window.location.href = 'dashboard.html';
  }

  document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById('loginError');
    const btn = document.getElementById('loginBtn');
    errorBox.style.display = 'none';

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    btn.disabled = true;
    btn.textContent = 'Signing in…';

    try {
      const data = await adminApiRequest('/admin/login', {
        method: 'POST',
        auth: false,
        body: { email, password }
      });

      localStorage.setItem('chai_admin_token', data.token);
      localStorage.setItem('chai_admin', JSON.stringify(data.admin));
      window.location.href = 'dashboard.html';
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Sign in';
    }
  });
</script>
</body>
</html>
