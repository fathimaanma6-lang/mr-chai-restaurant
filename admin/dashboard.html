<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Mr. Chai Admin</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../client/css/style.css" rel="stylesheet">
<link href="css/admin.css" rel="stylesheet">
</head>
<body class="admin-body">

<!-- ============ SIDEBAR ============ -->
<aside class="admin-sidebar">
  <div class="brand"><img src="../client/images/logo-icon.png" alt="Mr. Chai" class="sidebar-logo-img"> Mr. Chai</div>
  <nav class="nav flex-column flex-grow-1">
    <a class="nav-link" href="dashboard.html">📊 Dashboard</a>
    <a class="nav-link" href="menu.html">🍽️ Menu</a>
    <a class="nav-link" href="orders.html">🧾 Orders</a>
    <a class="nav-link" href="customers.html">👥 Customers</a>
    <a class="nav-link" href="sales-report.html">📈 Sales Report</a>
  </nav>
  <div class="sidebar-footer">
    <div class="admin-name" id="adminName">Admin</div>
    <a href="#" id="adminLogoutBtn" class="nav-link p-0 small" style="opacity:0.8;">Logout</a>
  </div>
</aside>

<!-- ============ MAIN CONTENT ============ -->
<main class="admin-main">
  <div class="admin-topbar">
    <div>
      <p class="section-eyebrow mb-1">Overview</p>
      <h1 class="h3 mb-0">Dashboard</h1>
    </div>
  </div>

  <!-- Stat cards -->
  <div class="row g-4 mb-5" id="statCards">
    <div class="col-12 text-muted">Loading stats…</div>
  </div>

  <!-- Recent orders -->
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="h5 mb-0">Recent orders</h2>
    <a href="orders.html" class="small">View all orders →</a>
  </div>
  <div class="admin-table">
    <table class="table mb-0">
      <thead>
        <tr>
          <th>Order #</th>
          <th>Customer</th>
          <th>Total</th>
          <th>Status</th>
          <th>Placed</th>
        </tr>
      </thead>
      <tbody id="recentOrdersBody">
        <tr><td colspan="5" class="text-center text-muted py-4">Loading…</td></tr>
      </tbody>
    </table>
  </div>
</main>

<script src="js/config.js"></script>
<script src="js/admin-api.js"></script>
<script src="js/admin-nav.js"></script>
<script>
  async function loadDashboard() {
    try {
      const data = await adminApiRequest('/admin/dashboard');
      renderStats(data.stats);
      renderRecentOrders(data.recentOrders);
    } catch (err) {
      showAdminToast(err.message, 'error');
    }
  }

  function renderStats(stats) {
    const container = document.getElementById('statCards');
    const cards = [
      { label: 'Total orders', value: stats.totalOrders },
      { label: 'Total customers', value: stats.totalCustomers },
      { label: 'Revenue (paid)', value: formatPrice(stats.totalRevenue) },
      { label: 'Pending orders', value: stats.pendingOrders }
    ];
    container.innerHTML = cards.map(c => `
      <div class="col-6 col-lg-3">
        <div class="stat-card">
          <div class="stat-label">${c.label}</div>
          <div class="stat-value">${c.value}</div>
        </div>
      </div>
    `).join('');
  }

  function renderRecentOrders(orders) {
    const body = document.getElementById('recentOrdersBody');
    if (orders.length === 0) {
      body.innerHTML = `<tr><td colspan="5" class="text-center text-muted py-4">No orders yet.</td></tr>`;
      return;
    }
    body.innerHTML = orders.map(o => `
      <tr>
        <td class="font-mono small">${o.order_number}</td>
        <td>${o.full_name}</td>
        <td class="font-mono">${formatPrice(o.total_amount)}</td>
        <td><span class="status-badge status-${o.status}">${o.status.replace(/_/g, ' ')}</span></td>
        <td class="small text-muted">${formatDate(o.created_at)}</td>
      </tr>
    `).join('');
  }

  loadDashboard();
</script>
</body>
</html>
