<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sales Report — Mr. Chai Admin</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../client/css/style.css" rel="stylesheet">
<link href="css/admin.css" rel="stylesheet">
</head>
<body class="admin-body">

<!-- ============ SIDEBAR ============ -->
<aside class="admin-sidebar">
  <div class="brand"><img src="../client/images/logo-icon.png" alt="Mr. Chai" class="sidebar-logo-img"> Mr. Chai</div>
  <nav class="nav flex-column flex-grow-1">
    <a class="nav-link" href="dashboard.html">📊 Dashboard</a>
    <a class="nav-link" href="menu.html">🍽️ Menu</a>
    <a class="nav-link" href="orders.html">🧾 Orders</a>
    <a class="nav-link" href="customers.html">👥 Customers</a>
    <a class="nav-link" href="sales-report.html">📈 Sales Report</a>
  </nav>
  <div class="sidebar-footer">
    <div class="admin-name" id="adminName">Admin</div>
    <a href="#" id="adminLogoutBtn" class="nav-link p-0 small" style="opacity:0.8;">Logout</a>
  </div>
</aside>

<!-- ============ MAIN CONTENT ============ -->
<main class="admin-main">
  <div class="admin-topbar">
    <div>
      <p class="section-eyebrow mb-1">Analytics</p>
      <h1 class="h3 mb-0">Sales report</h1>
    </div>
    <form id="dateFilterForm" class="d-flex gap-2 align-items-end">
      <div>
        <label class="form-label small fw-semibold mb-1">From</label>
        <input type="date" class="form-control chai-form-control" id="startDate">
      </div>
      <div>
        <label class="form-label small fw-semibold mb-1">To</label>
        <input type="date" class="form-control chai-form-control" id="endDate">
      </div>
      <button type="submit" class="btn btn-chai-primary">Apply</button>
      <button type="button" class="btn btn-chai-outline" id="clearFilterBtn">Clear</button>
    </form>
  </div>

  <!-- Summary -->
  <div class="row g-4 mb-5" id="summaryCards"></div>

  <div class="row g-4">
    <!-- Daily revenue table -->
    <div class="col-lg-7">
      <h2 class="h5 mb-3">Daily revenue</h2>
      <div class="admin-table">
        <table class="table mb-0">
          <thead>
            <tr><th>Date</th><th>Orders</th><th>Revenue</th></tr>
          </thead>
          <tbody id="dailyBody">
            <tr><td colspan="3" class="text-center text-muted py-4">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Top items -->
    <div class="col-lg-5">
      <h2 class="h5 mb-3">Top-selling items</h2>
      <div class="admin-table">
        <table class="table mb-0">
          <thead>
            <tr><th>Item</th><th>Sold</th><th>Revenue</th></tr>
          </thead>
          <tbody id="topItemsBody">
            <tr><td colspan="3" class="text-center text-muted py-4">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<script src="js/config.js"></script>
<script src="js/admin-api.js"></script>
<script src="js/admin-nav.js"></script>
<script>
  async function loadReport() {
    const startDate = document.getElementById('startDate').value;
    const endDate = document.getElementById('endDate').value;

    let query = '';
    if (startDate && endDate) query = `?startDate=${startDate}&endDate=${endDate}`;

    try {
      const data = await adminApiRequest(`/admin/sales-report${query}`);
      renderSummary(data.dailyReport);
      renderDaily(data.dailyReport);
      renderTopItems(data.topItems);
    } catch (err) {
      showAdminToast(err.message, 'error');
    }
  }

  function renderSummary(dailyReport) {
    const totalOrders = dailyReport.reduce((sum, d) => sum + Number(d.totalOrders), 0);
    const totalRevenue = dailyReport.reduce((sum, d) => sum + Number(d.totalRevenue), 0);
    const avgOrderValue = totalOrders > 0 ? totalRevenue / totalOrders : 0;

    const container = document.getElementById('summaryCards');
    const cards = [
      { label: 'Paid orders', value: totalOrders },
      { label: 'Total revenue', value: formatPrice(totalRevenue) },
      { label: 'Avg. order value', value: formatPrice(avgOrderValue) }
    ];
    container.innerHTML = cards.map(c => `
      <div class="col-md-4">
        <div class="stat-card">
          <div class="stat-label">${c.label}</div>
          <div class="stat-value">${c.value}</div>
        </div>
      </div>
    `).join('');
  }

  function renderDaily(dailyReport) {
    const body = document.getElementById('dailyBody');
    if (dailyReport.length === 0) {
      body.innerHTML = `<tr><td colspan="3" class="text-center text-muted py-4">No paid orders in this range.</td></tr>`;
      return;
    }
    body.innerHTML = dailyReport.map(d => `
      <tr>
        <td class="small">${formatDate(d.date)}</td>
        <td class="font-mono">${d.totalOrders}</td>
        <td class="font-mono">${formatPrice(d.totalRevenue)}</td>
      </tr>
    `).join('');
  }

  function renderTopItems(topItems) {
    const body = document.getElementById('topItemsBody');
    if (topItems.length === 0) {
      body.innerHTML = `<tr><td colspan="3" class="text-center text-muted py-4">No sales data yet.</td></tr>`;
      return;
    }
    body.innerHTML = topItems.map(item => `
      <tr>
        <td class="small">${item.food_name}</td>
        <td class="font-mono">${item.totalSold}</td>
        <td class="font-mono">${formatPrice(item.totalRevenue)}</td>
      </tr>
    `).join('');
  }

  document.getElementById('dateFilterForm').addEventListener('submit', (e) => {
    e.preventDefault();
    loadReport();
  });

  document.getElementById('clearFilterBtn').addEventListener('click', () => {
    document.getElementById('startDate').value = '';
    document.getElementById('endDate').value = '';
    loadReport();
  });

  loadReport();
</script>
</body>
</html>
