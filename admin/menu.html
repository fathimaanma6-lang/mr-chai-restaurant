<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Menu — Mr. Chai Admin</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../client/css/style.css" rel="stylesheet">
<link href="css/admin.css" rel="stylesheet">
</head>
<body class="admin-body">

<!-- ============ SIDEBAR ============ -->
<aside class="admin-sidebar">
  <div class="brand"><img src="../client/images/logo-icon.png" alt="Mr. Chai" class="sidebar-logo-img"> Mr. Chai</div>
  <nav class="nav flex-column flex-grow-1">
    <a class="nav-link" href="dashboard.html">📊 Dashboard</a>
    <a class="nav-link" href="menu.html">🍽️ Menu</a>
    <a class="nav-link" href="orders.html">🧾 Orders</a>
    <a class="nav-link" href="customers.html">👥 Customers</a>
    <a class="nav-link" href="sales-report.html">📈 Sales Report</a>
  </nav>
  <div class="sidebar-footer">
    <div class="admin-name" id="adminName">Admin</div>
    <a href="#" id="adminLogoutBtn" class="nav-link p-0 small" style="opacity:0.8;">Logout</a>
  </div>
</aside>

<!-- ============ MAIN CONTENT ============ -->
<main class="admin-main">
  <div class="admin-topbar">
    <div>
      <p class="section-eyebrow mb-1">Menu management</p>
      <h1 class="h3 mb-0">Food items</h1>
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-chai-outline" id="manageCategoriesBtn">Manage categories</button>
      <button class="btn btn-chai-primary" id="addFoodBtn">+ Add food item</button>
    </div>
  </div>

  <div class="admin-table">
    <table class="table mb-0 align-middle">
      <thead>
        <tr>
          <th>Image</th>
          <th>Name</th>
          <th>Category</th>
          <th>Price</th>
          <th>Available</th>
          <th>Featured</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="foodsBody">
        <tr><td colspan="7" class="text-center text-muted py-4">Loading…</td></tr>
      </tbody>
    </table>
  </div>
</main>

<!-- ============ ADD/EDIT FOOD MODAL ============ -->
<div class="modal fade" id="foodModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content" style="border-radius: var(--radius-md);">
      <div class="modal-header">
        <h5 class="modal-title" id="foodModalTitle">Add food item</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="foodForm">
        <div class="modal-body">
          <input type="hidden" id="foodId">

          <div class="mb-3">
            <label class="form-label small fw-semibold">Name</label>
            <input type="text" class="form-control chai-form-control" id="name" required>
          </div>

          <div class="mb-3">
            <label class="form-label small fw-semibold">Category</label>
            <select class="form-select chai-form-control" id="category_id" required></select>
          </div>

          <div class="mb-3">
            <label class="form-label small fw-semibold">Description</label>
            <textarea class="form-control chai-form-control" id="description" rows="2"></textarea>
          </div>

          <div class="mb-3">
            <label class="form-label small fw-semibold">Price (Rs.)</label>
            <input type="number" step="0.01" min="0" class="form-control chai-form-control" id="price" required>
          </div>

          <div class="mb-3">
            <label class="form-label small fw-semibold">Image</label>
            <input type="file" class="form-control chai-form-control" id="image" accept="image/png,image/jpeg,image/webp">
            <div class="form-text">Leave empty to keep the current image when editing.</div>
          </div>

          <div class="d-flex gap-4">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="is_available" checked>
              <label class="form-check-label small" for="is_available">Available</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="is_featured">
              <label class="form-check-label small" for="is_featured">Featured on home page</label>
            </div>
          </div>

          <div id="foodFormError" class="alert alert-danger py-2 small mt-3 mb-0" style="display:none;"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-chai-outline" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-chai-primary" id="foodSaveBtn">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- ============ MANAGE CATEGORIES MODAL ============ -->
<div class="modal fade" id="categoryModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content" style="border-radius: var(--radius-md);">
      <div class="modal-header">
        <h5 class="modal-title">Manage categories</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <ul class="list-group mb-3" id="categoryList"></ul>

        <form id="addCategoryForm" class="d-flex gap-2">
          <input type="text" class="form-control chai-form-control" id="newCategoryName" placeholder="New category name" required>
          <button type="submit" class="btn btn-chai-primary">Add</button>
        </form>
        <div id="categoryFormError" class="alert alert-danger py-2 small mt-3 mb-0" style="display:none;"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/admin-api.js"></script>
<script src="js/admin-nav.js"></script>
<script>
  let categories = [];
  let foodModal, categoryModal;

  document.addEventListener('DOMContentLoaded', () => {
    foodModal = new bootstrap.Modal(document.getElementById('foodModal'));
    categoryModal = new bootstrap.Modal(document.getElementById('categoryModal'));
    loadCategories().then(loadFoods);
  });

  // ---------------------------------------------------------------
  // CATEGORIES
  // ---------------------------------------------------------------
  async function loadCategories() {
    try {
      const data = await adminApiRequest('/categories', { auth: false });
      categories = data.categories;

      const select = document.getElementById('category_id');
      select.innerHTML = categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');

      renderCategoryList();
    } catch (err) {
      showAdminToast(err.message, 'error');
    }
  }

  function renderCategoryList() {
    const list = document.getElementById('categoryList');
    if (categories.length === 0) {
      list.innerHTML = `<li class="list-group-item small text-muted">No categories yet.</li>`;
      return;
    }
    list.innerHTML = categories.map(c => `
      <li class="list-group-item d-flex justify-content-between align-items-center">
        ${c.name}
        <button class="btn btn-sm btn-outline-danger" onclick="deleteCategory(${c.id})">Delete</button>
      </li>
    `).join('');
  }

  document.getElementById('manageCategoriesBtn').addEventListener('click', () => categoryModal.show());

  document.getElementById('addCategoryForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById('categoryFormError');
    errorBox.style.display = 'none';
    const nameInput = document.getElementById('newCategoryName');

    try {
      await adminApiRequest('/categories', { method: 'POST', body: { name: nameInput.value.trim() } });
      nameInput.value = '';
      showAdminToast('Category added.', 'success');
      await loadCategories();
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = 'block';
    }
  });

  async function deleteCategory(id) {
    if (!confirm('Delete this category? This only works if no food items use it.')) return;
    try {
      await adminApiRequest(`/categories/${id}`, { method: 'DELETE' });
      showAdminToast('Category deleted.', 'success');
      await loadCategories();
    } catch (err) {
      showAdminToast(err.message, 'error');
    }
  }

  // ---------------------------------------------------------------
  // FOODS
  // ---------------------------------------------------------------
  async function loadFoods() {
    const body = document.getElementById('foodsBody');
    try {
      const data = await adminApiRequest('/foods/admin/all');
      renderFoods(data.foods);
    } catch (err) {
      body.innerHTML = `<tr><td colspan="7" class="text-center text-danger py-4">${err.message}</td></tr>`;
    }
  }

  function renderFoods(foods) {
    const body = document.getElementById('foodsBody');
    if (foods.length === 0) {
      body.innerHTML = `<tr><td colspan="7" class="text-center text-muted py-4">No food items yet — add your first one.</td></tr>`;
      return;
    }

    body.innerHTML = foods.map(food => `
      <tr>
        <td><img src="${food.image ? UPLOADS_BASE_URL + food.image : 'https://placehold.co/60x60/F0E3CC/6B4A32?text=%20'}" style="width:48px;height:48px;object-fit:cover;border-radius:8px;"></td>
        <td class="fw-semibold">${food.name}</td>
        <td class="small text-muted">${food.category_name}</td>
        <td class="font-mono">${formatPrice(food.price)}</td>
        <td>${food.is_available ? '<span class="status-badge status-confirmed">Yes</span>' : '<span class="status-badge status-cancelled">No</span>'}</td>
        <td>${food.is_featured ? '⭐' : '—'}</td>
        <td>
          <button class="btn btn-sm btn-chai-outline" onclick="openEditFood(${food.id})">Edit</button>
          <button class="btn btn-sm btn-outline-danger" onclick="deleteFood(${food.id})">Delete</button>
        </td>
      </tr>
    `).join('');

    // Stash full food data for edit lookups
    window._foodsCache = foods;
  }

  document.getElementById('addFoodBtn').addEventListener('click', () => {
    document.getElementById('foodForm').reset();
    document.getElementById('foodId').value = '';
    document.getElementById('foodModalTitle').textContent = 'Add food item';
    document.getElementById('is_available').checked = true;
    document.getElementById('foodFormError').style.display = 'none';
    foodModal.show();
  });

  function openEditFood(id) {
    const food = (window._foodsCache || []).find(f => f.id === id);
    if (!food) return;

    document.getElementById('foodId').value = food.id;
    document.getElementById('name').value = food.name;
    document.getElementById('category_id').value = food.category_id;
    document.getElementById('description').value = food.description || '';
    document.getElementById('price').value = food.price;
    document.getElementById('is_available').checked = !!food.is_available;
    document.getElementById('is_featured').checked = !!food.is_featured;
    document.getElementById('image').value = '';
    document.getElementById('foodModalTitle').textContent = 'Edit food item';
    document.getElementById('foodFormError').style.display = 'none';
    foodModal.show();
  }

  document.getElementById('foodForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById('foodFormError');
    const btn = document.getElementById('foodSaveBtn');
    errorBox.style.display = 'none';

    const id = document.getElementById('foodId').value;
    const imageFile = document.getElementById('image').files[0];

    const formData = new FormData();
    formData.append('category_id', document.getElementById('category_id').value);
    formData.append('name', document.getElementById('name').value.trim());
    formData.append('description', document.getElementById('description').value.trim());
    formData.append('price', document.getElementById('price').value);
    formData.append('is_available', document.getElementById('is_available').checked ? '1' : '0');
    formData.append('is_featured', document.getElementById('is_featured').checked ? '1' : '0');
    if (imageFile) formData.append('image', imageFile);

    btn.disabled = true;
    btn.textContent = 'Saving…';

    try {
      if (id) {
        await adminApiRequest(`/foods/${id}`, { method: 'PUT', body: formData, isFormData: true });
        showAdminToast('Food item updated.', 'success');
      } else {
        await adminApiRequest('/foods', { method: 'POST', body: formData, isFormData: true });
        showAdminToast('Food item added.', 'success');
      }
      foodModal.hide();
      await loadFoods();
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Save';
    }
  });

  async function deleteFood(id) {
    if (!confirm('Delete this food item? This cannot be undone.')) return;
    try {
      await adminApiRequest(`/foods/${id}`, { method: 'DELETE' });
      showAdminToast('Food item deleted.', 'success');
      await loadFoods();
    } catch (err) {
      showAdminToast(err.message, 'error');
    }
  }
</script>
</body>
</html>
