<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Mr. Chai</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<!-- ============ NAVBAR ============ -->
<nav class="navbar navbar-expand-lg chai-navbar">
  <div class="container">
    <a class="navbar-brand" href="index.html"><img src="images/logo-icon.png" alt="Mr. Chai" class="navbar-logo-img"> Mr. Chai</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain" style="border-color: rgba(255,255,255,0.3);">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMain">
      <ul class="navbar-nav me-auto ms-lg-4">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="menu.html">Menu</a></li>
      </ul>
      <ul class="navbar-nav align-items-lg-center" id="navAuthArea"></ul>
      <a href="cart.html" class="nav-link ms-lg-3">
        Cart <span class="cart-badge" id="navCartBadge" style="display:none;"></span>
      </a>
    </div>
  </div>
</nav>

<div class="container">
  <!-- ============ LOGIN PANEL ============ -->
  <div class="auth-panel" id="loginPanel">
    <div class="text-center mb-4">
      <p class="section-eyebrow mb-2">Welcome back</p>
      <h1 class="h3">Sign in</h1>
    </div>

    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label small fw-semibold">Email</label>
        <input type="email" class="form-control chai-form-control" id="email" required placeholder="you@example.com">
      </div>
      <div class="mb-2">
        <label class="form-label small fw-semibold">Password</label>
        <input type="password" class="form-control chai-form-control" id="password" required placeholder="••••••••">
      </div>
      <div class="text-end mb-3">
        <a href="#" id="showForgotBtn" class="small">Forgot password?</a>
      </div>

      <div id="loginError" class="alert alert-danger py-2 small" style="display:none;"></div>
      <button type="submit" class="btn btn-chai-primary w-100" id="loginBtn">Sign in</button>
    </form>

    <p class="text-center small text-muted mt-4 mb-0">
      New to Mr. Chai? <a href="register.html">Create an account</a>
    </p>
  </div>

  <!-- ============ FORGOT PASSWORD PANEL (hidden by default) ============ -->
  <div class="auth-panel" id="forgotPanel" style="display:none;">
    <div class="text-center mb-4">
      <p class="section-eyebrow mb-2">Reset access</p>
      <h1 class="h3">Forgot your password?</h1>
      <p class="text-muted small">Enter your email and we'll generate a reset link.</p>
    </div>

    <form id="forgotForm">
      <div class="mb-3">
        <label class="form-label small fw-semibold">Email</label>
        <input type="email" class="form-control chai-form-control" id="forgotEmail" required placeholder="you@example.com">
      </div>
      <div id="forgotError" class="alert alert-danger py-2 small" style="display:none;"></div>
      <div id="forgotSuccess" class="alert alert-success py-2 small" style="display:none;"></div>
      <button type="submit" class="btn btn-chai-primary w-100" id="forgotBtn">Send reset link</button>
    </form>

    <p class="text-center small text-muted mt-4 mb-0">
      <a href="#" id="backToLoginBtn">← Back to sign in</a>
    </p>
  </div>

  <!-- ============ RESET PASSWORD PANEL (hidden, shown if a token is being used) ============ -->
  <div class="auth-panel" id="resetPanel" style="display:none;">
    <div class="text-center mb-4">
      <p class="section-eyebrow mb-2">Almost there</p>
      <h1 class="h3">Set a new password</h1>
    </div>

    <form id="resetForm">
      <div class="mb-4">
        <label class="form-label small fw-semibold">New password</label>
        <input type="password" class="form-control chai-form-control" id="newPassword" required minlength="6" placeholder="At least 6 characters">
      </div>
      <div id="resetError" class="alert alert-danger py-2 small" style="display:none;"></div>
      <button type="submit" class="btn btn-chai-primary w-100" id="resetBtn">Update password</button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script>
  if (isLoggedIn()) window.location.href = 'index.html';

  const loginPanel = document.getElementById('loginPanel');
  const forgotPanel = document.getElementById('forgotPanel');
  const resetPanel = document.getElementById('resetPanel');

  // If arriving via a reset link like login.html?token=XYZ, show the reset panel directly
  const resetToken = new URLSearchParams(window.location.search).get('token');
  if (resetToken) {
    loginPanel.style.display = 'none';
    resetPanel.style.display = 'block';
  }

  document.getElementById('showForgotBtn').addEventListener('click', (e) => {
    e.preventDefault();
    loginPanel.style.display = 'none';
    forgotPanel.style.display = 'block';
  });

  document.getElementById('backToLoginBtn').addEventListener('click', (e) => {
    e.preventDefault();
    forgotPanel.style.display = 'none';
    loginPanel.style.display = 'block';
  });

  // ---- LOGIN ----
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById('loginError');
    const btn = document.getElementById('loginBtn');
    errorBox.style.display = 'none';

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    btn.disabled = true;
    btn.textContent = 'Signing in…';

    try {
      const data = await apiRequest('/auth/login', { method: 'POST', body: { email, password } });
      localStorage.setItem('chai_token', data.token);
      localStorage.setItem('chai_user', JSON.stringify(data.user));
      window.location.href = 'index.html';
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Sign in';
    }
  });

  // ---- FORGOT PASSWORD ----
  document.getElementById('forgotForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById('forgotError');
    const successBox = document.getElementById('forgotSuccess');
    const btn = document.getElementById('forgotBtn');
    errorBox.style.display = 'none';
    successBox.style.display = 'none';

    const email = document.getElementById('forgotEmail').value.trim();
    btn.disabled = true;
    btn.textContent = 'Sending…';

    try {
      const data = await apiRequest('/auth/forgot-password', { method: 'POST', body: { email } });
      successBox.style.display = 'block';
      // Demo mode: the backend returns the token directly instead of emailing it.
      if (data.resetToken) {
        successBox.innerHTML = `Reset link generated (demo mode — no email sent).<br>
          <a href="login.html?token=${data.resetToken}">Click here to reset your password</a>`;
      } else {
        successBox.textContent = data.message;
      }
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Send reset link';
    }
  });

  // ---- RESET PASSWORD ----
  document.getElementById('resetForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById('resetError');
    const btn = document.getElementById('resetBtn');
    errorBox.style.display = 'none';

    const newPassword = document.getElementById('newPassword').value;
    btn.disabled = true;
    btn.textContent = 'Updating…';

    try {
      await apiRequest('/auth/reset-password', { method: 'POST', body: { token: resetToken, newPassword } });
      showToast('Password updated — please sign in.', 'success');
      setTimeout(() => window.location.href = 'login.html', 900);
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Update password';
    }
  });
</script>
</body>
</html>
