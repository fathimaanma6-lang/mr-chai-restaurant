<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Confirmed — Mr. Chai</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<!-- ============ NAVBAR ============ -->
<nav class="navbar navbar-expand-lg chai-navbar">
  <div class="container">
    <a class="navbar-brand" href="index.html"><img src="images/logo-icon.png" alt="Mr. Chai" class="navbar-logo-img"> Mr. Chai</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain" style="border-color: rgba(255,255,255,0.3);">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMain">
      <ul class="navbar-nav me-auto ms-lg-4">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="menu.html">Menu</a></li>
      </ul>
      <ul class="navbar-nav align-items-lg-center" id="navAuthArea"></ul>
      <a href="cart.html" class="nav-link ms-lg-3">
        Cart <span class="cart-badge" id="navCartBadge" style="display:none;"></span>
      </a>
    </div>
  </div>
</nav>

<div class="container chai-section text-center">
  <div style="max-width: 480px; margin: 0 auto;">
    <p class="fs-1 mb-2">✅</p>
    <p class="section-eyebrow mb-2">Payment successful</p>
    <h1 class="mb-4">Your order is confirmed</h1>

    <div id="ticketContainer" class="text-start">
      <p class="text-muted">Loading your order…</p>
    </div>

    <div class="d-flex gap-3 justify-content-center mt-4">
      <a href="orders.html" class="btn btn-chai-outline">View order history</a>
      <a href="menu.html" class="btn btn-chai-primary">Order more</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script>
  requireLogin();

  const orderId = new URLSearchParams(window.location.search).get('order');

  async function loadOrder() {
    const container = document.getElementById('ticketContainer');
    if (!orderId) {
      container.innerHTML = `<p class="text-danger">No order specified.</p>`;
      return;
    }

    try {
      const data = await apiRequest(`/orders/my-orders/${orderId}`, { auth: true });
      renderTicket(data.order, data.items);
    } catch (err) {
      container.innerHTML = `<p class="text-danger">${err.message}</p>`;
    }
  }

  function renderTicket(order, items) {
    const container = document.getElementById('ticketContainer');
    const itemRows = items.map(item => `
      <div class="d-flex justify-content-between font-mono small mb-2">
        <span>${item.quantity}× ${item.food_name}</span><span>${formatPrice(item.subtotal)}</span>
      </div>
    `).join('');

    container.innerHTML = `
      <div class="ticket p-4 p-md-5 mx-auto" style="max-width: 420px;">
        <p class="font-mono small text-uppercase mb-1" style="color: var(--chai-brown-light); letter-spacing: 0.06em;">Order receipt</p>
        <h3 class="display-font mb-3" style="font-size: 1.3rem;">${order.order_number}</h3>
        <div class="ticket-dashed pt-3 mb-3">
          ${itemRows}
        </div>
        <div class="ticket-dashed pt-3 mb-3 d-flex justify-content-between">
          <span class="font-mono fw-bold">Total</span>
          <span class="font-mono fw-bold text-clay">${formatPrice(order.total_amount)}</span>
        </div>
        <div class="d-flex justify-content-between align-items-center">
          <span class="font-mono small text-muted">Status</span>
          <span class="status-badge status-${order.status}">${order.status.replace(/_/g, ' ')}</span>
        </div>
      </div>
    `;
  }

  loadOrder();
</script>
</body>
</html>
