<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — Mr. Chai</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<!-- ============ NAVBAR ============ -->
<nav class="navbar navbar-expand-lg chai-navbar">
  <div class="container">
    <a class="navbar-brand" href="index.html"><img src="images/logo-icon.png" alt="Mr. Chai" class="navbar-logo-img"> Mr. Chai</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain" style="border-color: rgba(255,255,255,0.3);">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMain">
      <ul class="navbar-nav me-auto ms-lg-4">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="menu.html">Menu</a></li>
      </ul>
      <ul class="navbar-nav align-items-lg-center" id="navAuthArea"></ul>
      <a href="cart.html" class="nav-link ms-lg-3">
        Cart <span class="cart-badge" id="navCartBadge" style="display:none;"></span>
      </a>
    </div>
  </div>
</nav>

<div class="container chai-section">
  <p class="section-eyebrow mb-2">Last step</p>
  <h1 class="mb-5">Checkout</h1>

  <div id="checkoutContent">
    <p class="text-muted">Loading…</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script>
  requireLogin();
  let currentOrder = null; // set once checkout() succeeds, used by the payment step

  // ---------------------------------------------------------------
  // STEP 1: show cart summary + delivery form
  // ---------------------------------------------------------------
  async function loadCheckout() {
    const container = document.getElementById('checkoutContent');
    try {
      const cartData = await apiRequest('/cart', { auth: true });

      if (cartData.items.length === 0) {
        container.innerHTML = `
          <div class="text-center py-5">
            <p class="fs-1 mb-3">🛒</p>
            <h3 class="h5 mb-2">Your cart is empty</h3>
            <a href="menu.html" class="btn btn-chai-primary">Browse the menu</a>
          </div>
        `;
        return;
      }

      const user = getCurrentUser();
      const itemRows = cartData.items.map(item => `
        <div class="d-flex justify-content-between font-mono small mb-2">
          <span>${item.quantity}× ${item.name}</span><span>${formatPrice(item.subtotal)}</span>
        </div>
      `).join('');

      container.innerHTML = `
        <div class="row g-4">
          <div class="col-lg-7">
            <div class="chai-card p-4">
              <h3 class="h6 mb-3">Delivery details</h3>
              <form id="deliveryForm">
                <div class="mb-3">
                  <label class="form-label small fw-semibold">Delivery address</label>
                  <textarea class="form-control chai-form-control" id="delivery_address" rows="2" required>${user?.address || ''}</textarea>
                </div>
                <div class="mb-3">
                  <label class="form-label small fw-semibold">Phone number</label>
                  <input type="tel" class="form-control chai-form-control" id="phone" required value="${user?.phone || ''}">
                </div>
                <div class="mb-4">
                  <label class="form-label small fw-semibold">Order notes (optional)</label>
                  <textarea class="form-control chai-form-control" id="notes" rows="2" placeholder="e.g. less spicy, ring the bell"></textarea>
                </div>

                <h3 class="h6 mb-3">Payment (demo)</h3>
                <p class="small text-muted mb-3">This is a simulated payment for demo purposes — no real card is charged.</p>
                <div class="mb-3">
                  <label class="form-label small fw-semibold">Card number</label>
                  <input type="text" class="form-control chai-form-control" id="card_number" required placeholder="4242 4242 4242 4242" maxlength="19">
                </div>
                <div class="row g-2 mb-4">
                  <div class="col-6">
                    <label class="form-label small fw-semibold">Expiry</label>
                    <input type="text" class="form-control chai-form-control" id="card_expiry" required placeholder="MM/YY" maxlength="5">
                  </div>
                  <div class="col-6">
                    <label class="form-label small fw-semibold">CVV</label>
                    <input type="text" class="form-control chai-form-control" id="card_cvv" required placeholder="123" maxlength="4">
                  </div>
                </div>

                <div id="checkoutError" class="alert alert-danger py-2 small" style="display:none;"></div>
                <button type="submit" class="btn btn-chai-primary w-100" id="placeOrderBtn">Place order & pay ${formatPrice(cartData.total)}</button>
              </form>
            </div>
          </div>

          <div class="col-lg-5">
            <div class="ticket p-4">
              <p class="font-mono small text-uppercase mb-3" style="color: var(--chai-brown-light); letter-spacing: 0.06em;">Order summary</p>
              ${itemRows}
              <div class="ticket-dashed pt-3 mt-2 d-flex justify-content-between">
                <span class="font-mono fw-bold">Total</span>
                <span class="font-mono fw-bold text-clay fs-5">${formatPrice(cartData.total)}</span>
              </div>
            </div>
          </div>
        </div>
      `;

      document.getElementById('deliveryForm').addEventListener('submit', handleCheckout);
    } catch (err) {
      container.innerHTML = `<p class="text-danger">${err.message}</p>`;
    }
  }

  // ---------------------------------------------------------------
  // STEP 2: create the order, then confirm demo payment
  // ---------------------------------------------------------------
  async function handleCheckout(e) {
    e.preventDefault();
    const errorBox = document.getElementById('checkoutError');
    const btn = document.getElementById('placeOrderBtn');
    errorBox.style.display = 'none';

    const delivery_address = document.getElementById('delivery_address').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const notes = document.getElementById('notes').value.trim();
    const card_number = document.getElementById('card_number').value.replace(/\s/g, '');
    const card_expiry = document.getElementById('card_expiry').value.trim();
    const card_cvv = document.getElementById('card_cvv').value.trim();

    btn.disabled = true;
    btn.textContent = 'Placing order…';

    try {
      // Step A: create the order from the cart
      const orderData = await apiRequest('/orders/checkout', {
        method: 'POST', auth: true,
        body: { delivery_address, phone, notes }
      });
      currentOrder = orderData.order;

      // Step B: confirm demo payment
      btn.textContent = 'Processing payment…';
      await apiRequest('/payments/confirm', {
        method: 'POST', auth: true,
        body: { order_id: currentOrder.id, card_number, card_expiry, card_cvv }
      });

      // Success — redirect to order confirmation
      refreshNavCartCount();
      window.location.href = `order-confirmation.html?order=${currentOrder.id}`;
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Try again';
    }
  }

  loadCheckout();
</script>
</body>
</html>
