<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart — Mr. Chai</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<!-- ============ NAVBAR ============ -->
<nav class="navbar navbar-expand-lg chai-navbar">
  <div class="container">
    <a class="navbar-brand" href="index.html"><img src="images/logo-icon.png" alt="Mr. Chai" class="navbar-logo-img"> Mr. Chai</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain" style="border-color: rgba(255,255,255,0.3);">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMain">
      <ul class="navbar-nav me-auto ms-lg-4">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="menu.html">Menu</a></li>
      </ul>
      <ul class="navbar-nav align-items-lg-center" id="navAuthArea"></ul>
      <a href="cart.html" class="nav-link ms-lg-3 active">
        Cart <span class="cart-badge" id="navCartBadge" style="display:none;"></span>
      </a>
    </div>
  </div>
</nav>

<div class="container chai-section">
  <p class="section-eyebrow mb-2">Before you check out</p>
  <h1 class="mb-5">Your cart</h1>

  <div id="cartContent">
    <p class="text-muted">Loading your cart…</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script>
  requireLogin();

  async function loadCart() {
    const container = document.getElementById('cartContent');
    try {
      const data = await apiRequest('/cart', { auth: true });
      renderCart(data.items, data.total);
    } catch (err) {
      container.innerHTML = `<p class="text-danger">${err.message}</p>`;
    }
  }

  function renderCart(items, total) {
    const container = document.getElementById('cartContent');

    if (items.length === 0) {
      container.innerHTML = `
        <div class="text-center py-5">
          <p class="fs-1 mb-3">🍽️</p>
          <h3 class="h5 mb-2">Your cart is empty</h3>
          <p class="text-muted mb-4">Add something from the menu to get started.</p>
          <a href="menu.html" class="btn btn-chai-primary">Browse the menu</a>
        </div>
      `;
      return;
    }

    const rows = items.map(item => `
      <div class="d-flex align-items-center gap-3 py-3" style="border-bottom: 1px solid var(--chai-cream-dark);" data-cart-id="${item.cart_id}">
        <img src="${item.image ? UPLOADS_BASE_URL + item.image : 'https://placehold.co/80x80/F0E3CC/6B4A32?text=%20'}" style="width:64px;height:64px;object-fit:cover;border-radius:10px;">
        <div class="flex-grow-1">
          <h3 class="h6 mb-1">${item.name}</h3>
          <p class="font-mono small text-muted mb-0">${formatPrice(item.price)} each</p>
        </div>
        <div class="d-flex align-items-center gap-2">
          <button class="btn btn-sm btn-chai-outline qty-btn" data-action="dec" data-cart-id="${item.cart_id}" data-qty="${item.quantity}">−</button>
          <span class="font-mono fw-semibold" style="min-width: 24px; text-align:center;">${item.quantity}</span>
          <button class="btn btn-sm btn-chai-outline qty-btn" data-action="inc" data-cart-id="${item.cart_id}" data-qty="${item.quantity}">+</button>
        </div>
        <div class="font-mono fw-bold text-clay" style="min-width: 70px; text-align:right;">${formatPrice(item.subtotal)}</div>
        <button class="btn btn-sm text-danger remove-btn" data-cart-id="${item.cart_id}" title="Remove">✕</button>
      </div>
    `).join('');

    container.innerHTML = `
      <div class="row">
        <div class="col-lg-8">
          <div class="chai-card p-4">
            ${rows}
          </div>
        </div>
        <div class="col-lg-4">
          <div class="ticket p-4 mt-4 mt-lg-0">
            <p class="font-mono small text-uppercase mb-3" style="color: var(--chai-brown-light); letter-spacing: 0.06em;">Order summary</p>
            <div class="d-flex justify-content-between font-mono mb-2">
              <span>Subtotal</span><span>${formatPrice(total)}</span>
            </div>
            <div class="ticket-dashed pt-3 mt-2 d-flex justify-content-between">
              <span class="font-mono fw-bold">Total</span>
              <span class="font-mono fw-bold text-clay fs-5">${formatPrice(total)}</span>
            </div>
            <a href="checkout.html" class="btn btn-chai-primary w-100 mt-4">Proceed to checkout</a>
          </div>
        </div>
      </div>
    `;

    attachCartHandlers();
  }

  function attachCartHandlers() {
    document.querySelectorAll('.qty-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const cartId = btn.dataset.cartId;
        const currentQty = Number(btn.dataset.qty);
        const newQty = btn.dataset.action === 'inc' ? currentQty + 1 : currentQty - 1;

        if (newQty < 1) {
          await removeItem(cartId);
          return;
        }

        try {
          await apiRequest(`/cart/${cartId}`, { method: 'PUT', auth: true, body: { quantity: newQty } });
          await loadCart();
          refreshNavCartCount();
        } catch (err) {
          showToast(err.message, 'error');
        }
      });
    });

    document.querySelectorAll('.remove-btn').forEach(btn => {
      btn.addEventListener('click', () => removeItem(btn.dataset.cartId));
    });
  }

  async function removeItem(cartId) {
    try {
      await apiRequest(`/cart/${cartId}`, { method: 'DELETE', auth: true });
      showToast('Item removed.', 'default');
      await loadCart();
      refreshNavCartCount();
    } catch (err) {
      showToast(err.message, 'error');
    }
  }

  loadCart();
</script>
</body>
</html>
