<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Orders — Mr. Chai</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<!-- ============ NAVBAR ============ -->
<nav class="navbar navbar-expand-lg chai-navbar">
  <div class="container">
    <a class="navbar-brand" href="index.html"><img src="images/logo-icon.png" alt="Mr. Chai" class="navbar-logo-img"> Mr. Chai</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain" style="border-color: rgba(255,255,255,0.3);">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMain">
      <ul class="navbar-nav me-auto ms-lg-4">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="menu.html">Menu</a></li>
      </ul>
      <ul class="navbar-nav align-items-lg-center" id="navAuthArea"></ul>
      <a href="cart.html" class="nav-link ms-lg-3">
        Cart <span class="cart-badge" id="navCartBadge" style="display:none;"></span>
      </a>
    </div>
  </div>
</nav>

<div class="container chai-section">
  <p class="section-eyebrow mb-2">Your history</p>
  <h1 class="mb-5">My orders</h1>

  <div id="ordersList">
    <p class="text-muted">Loading your orders…</p>
  </div>
</div>

<!-- ============ ORDER DETAIL MODAL ============ -->
<div class="modal fade" id="orderDetailModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content" style="border-radius: var(--radius-md);">
      <div class="modal-header">
        <h5 class="modal-title">Order details</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="orderDetailBody">
        <p class="text-muted">Loading…</p>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script>
  requireLogin();
  let orderDetailModal;

  document.addEventListener('DOMContentLoaded', () => {
    orderDetailModal = new bootstrap.Modal(document.getElementById('orderDetailModal'));
    loadOrders();
  });

  async function loadOrders() {
    const container = document.getElementById('ordersList');
    try {
      const data = await apiRequest('/orders/my-orders', { auth: true });
      renderOrders(data.orders);
    } catch (err) {
      container.innerHTML = `<p class="text-danger">${err.message}</p>`;
    }
  }

  function renderOrders(orders) {
    const container = document.getElementById('ordersList');

    if (orders.length === 0) {
      container.innerHTML = `
        <div class="text-center py-5">
          <p class="fs-1 mb-3">🧾</p>
          <h3 class="h5 mb-2">No orders yet</h3>
          <a href="menu.html" class="btn btn-chai-primary">Browse the menu</a>
        </div>
      `;
      return;
    }

    container.innerHTML = orders.map(order => `
      <div class="ticket p-4 mb-3 d-flex justify-content-between align-items-center flex-wrap gap-3">
        <div>
          <h3 class="h6 mb-1">${order.order_number}</h3>
          <p class="small text-muted mb-0">${formatDate(order.created_at)}</p>
        </div>
        <div class="d-flex align-items-center gap-3 flex-wrap">
          <span class="status-badge status-${order.status}">${order.status.replace(/_/g, ' ')}</span>
          <span class="status-badge status-${order.payment_status}">${order.payment_status}</span>
          <span class="font-mono fw-bold text-clay">${formatPrice(order.total_amount)}</span>
          <button class="btn btn-sm btn-chai-outline" onclick="viewOrder(${order.id})">View</button>
        </div>
      </div>
    `).join('');
  }

  async function viewOrder(orderId) {
    orderDetailModal.show();
    const body = document.getElementById('orderDetailBody');
    body.innerHTML = `<p class="text-muted">Loading…</p>`;

    try {
      const data = await apiRequest(`/orders/my-orders/${orderId}`, { auth: true });
      const order = data.order;
      const itemRows = data.items.map(item => `
        <div class="d-flex justify-content-between font-mono small mb-2">
          <span>${item.quantity}× ${item.food_name}</span><span>${formatPrice(item.subtotal)}</span>
        </div>
      `).join('');

      body.innerHTML = `
        <p class="font-mono small text-muted mb-3">${order.order_number} · ${formatDate(order.created_at)}</p>
        ${itemRows}
        <div class="ticket-dashed pt-3 mt-2 mb-3 d-flex justify-content-between">
          <span class="font-mono fw-bold">Total</span>
          <span class="font-mono fw-bold text-clay">${formatPrice(order.total_amount)}</span>
        </div>
        <p class="small mb-1"><strong>Delivery address:</strong> ${order.delivery_address}</p>
        <p class="small mb-1"><strong>Phone:</strong> ${order.phone}</p>
        ${order.notes ? `<p class="small mb-1"><strong>Notes:</strong> ${order.notes}</p>` : ''}
        <div class="d-flex gap-2 mt-3">
          <span class="status-badge status-${order.status}">${order.status.replace(/_/g, ' ')}</span>
          <span class="status-badge status-${order.payment_status}">${order.payment_status}</span>
        </div>
      `;
    } catch (err) {
      body.innerHTML = `<p class="text-danger">${err.message}</p>`;
    }
  }

  loadOrders();
</script>
</body>
</html>
