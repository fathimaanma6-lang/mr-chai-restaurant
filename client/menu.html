<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu — Mr. Chai</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<!-- ============ NAVBAR ============ -->
<nav class="navbar navbar-expand-lg chai-navbar">
  <div class="container">
    <a class="navbar-brand" href="index.html"><img src="images/logo-icon.png" alt="Mr. Chai" class="navbar-logo-img"> Mr. Chai</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain" style="border-color: rgba(255,255,255,0.3);">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMain">
      <ul class="navbar-nav me-auto ms-lg-4">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link active" href="menu.html">Menu</a></li>
      </ul>
      <ul class="navbar-nav align-items-lg-center" id="navAuthArea"></ul>
      <a href="cart.html" class="nav-link ms-lg-3">
        Cart <span class="cart-badge" id="navCartBadge" style="display:none;"></span>
      </a>
    </div>
  </div>
</nav>

<!-- ============ PAGE HEADER + SEARCH ============ -->
<header class="py-5" style="background-color: var(--chai-cream-dark);">
  <div class="container">
    <p class="section-eyebrow mb-2">The full menu</p>
    <h1 class="mb-4">What are you craving?</h1>
    <div class="row">
      <div class="col-md-6">
        <div class="input-group">
          <span class="input-group-text bg-white border-0" style="border-radius: var(--radius-sm) 0 0 var(--radius-sm);">🔍</span>
          <input type="text" id="searchInput" class="form-control chai-form-control border-0" placeholder="Search for milk tea, fried rice…">
        </div>
      </div>
    </div>
  </div>
</header>

<!-- ============ CATEGORY FILTER + GRID ============ -->
<section class="chai-section">
  <div class="container">
    <div class="d-flex gap-2 flex-wrap mb-5" id="categoryFilters">
      <span class="font-mono small text-muted">Loading categories…</span>
    </div>

    <div id="menuStatus" class="text-muted small mb-3" style="display:none;"></div>
    <div class="row g-4" id="menuGrid">
      <!-- filled by JS -->
    </div>
  </div>
</section>

<!-- ============ FOOTER ============ -->
<footer class="chai-footer">
  <div class="container">
    <div class="row">
      <div class="col-md-6 mb-3 mb-md-0">
        <h3 class="display-font d-flex align-items-center gap-2" style="color: var(--chai-cream); font-size: 1.3rem;"><img src="images/logo-icon.png" alt="" style="height:28px;"> Mr. Chai</h3>
        <p class="small mb-0" style="opacity: 0.75;">Handmade tea & rice, made to order.</p>
      </div>
      <div class="col-md-6 text-md-end small" style="opacity: 0.75;">
        <a href="menu.html">Menu</a> · <a href="orders.html">Track an order</a> · <a href="login.html">Sign in</a>
      </div>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script>
  let allCategories = [];
  let activeCategory = null;
  let searchDebounce = null;

  // Read ?category=ID from the URL (set when arriving from the home page)
  const urlParams = new URLSearchParams(window.location.search);
  activeCategory = urlParams.get('category');

  async function loadCategories() {
    const container = document.getElementById('categoryFilters');
    try {
      const data = await apiRequest('/categories');
      allCategories = data.categories;
      renderCategoryFilters();
    } catch (err) {
      container.innerHTML = `<span class="text-danger small">${err.message}</span>`;
    }
  }

  function renderCategoryFilters() {
    const container = document.getElementById('categoryFilters');
    const allBtn = `<button class="btn btn-sm ${!activeCategory ? 'btn-chai-primary' : 'btn-chai-outline'}" data-cat="">All</button>`;
    const catBtns = allCategories.map(cat =>
      `<button class="btn btn-sm ${String(activeCategory) === String(cat.id) ? 'btn-chai-primary' : 'btn-chai-outline'}" data-cat="${cat.id}">${cat.name}</button>`
    ).join('');
    container.innerHTML = allBtn + catBtns;

    container.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        activeCategory = btn.dataset.cat || null;
        document.getElementById('searchInput').value = '';
        renderCategoryFilters();
        loadFoods();
      });
    });
  }

  async function loadFoods() {
    const grid = document.getElementById('menuGrid');
    const status = document.getElementById('menuStatus');
    status.style.display = 'none';
    grid.innerHTML = `<div class="col-12 text-center py-5 text-muted">Loading menu…</div>`;

    try {
      const query = activeCategory ? `?category=${activeCategory}` : '';
      const data = await apiRequest(`/foods${query}`);
      renderFoods(data.foods);
    } catch (err) {
      grid.innerHTML = '';
      status.style.display = 'block';
      status.className = 'text-danger small mb-3';
      status.textContent = err.message;
    }
  }

  async function searchFoods(term) {
    const grid = document.getElementById('menuGrid');
    const status = document.getElementById('menuStatus');
    status.style.display = 'none';
    grid.innerHTML = `<div class="col-12 text-center py-5 text-muted">Searching…</div>`;

    try {
      const data = await apiRequest(`/foods/search?q=${encodeURIComponent(term)}`);
      renderFoods(data.foods);
    } catch (err) {
      grid.innerHTML = '';
      status.style.display = 'block';
      status.className = 'text-danger small mb-3';
      status.textContent = err.message;
    }
  }

  function renderFoods(foods) {
    const grid = document.getElementById('menuGrid');
    const status = document.getElementById('menuStatus');

    if (foods.length === 0) {
      grid.innerHTML = '';
      status.style.display = 'block';
      status.className = 'text-muted small mb-3';
      status.textContent = 'No dishes match — try a different search or category.';
      return;
    }

    status.style.display = 'none';
    grid.innerHTML = foods.map(food => `
      <div class="col-6 col-md-4 col-lg-3">
        <div class="chai-card h-100 d-flex flex-column">
          <img src="${food.image ? UPLOADS_BASE_URL + food.image : 'https://placehold.co/400x300/F0E3CC/6B4A32?text=' + encodeURIComponent(food.name)}" class="food-card-img" alt="${food.name}">
          <div class="p-3 d-flex flex-column flex-grow-1">
            <p class="font-mono small text-muted mb-1">${food.category_name}</p>
            <h3 class="h6 mb-1">${food.name}</h3>
            <p class="small text-muted mb-3" style="flex-grow:1;">${food.description || ''}</p>
            <div class="d-flex justify-content-between align-items-center">
              <span class="food-card-price">${formatPrice(food.price)}</span>
              <button class="btn btn-sm btn-chai-primary" onclick="addToCart(${food.id}, this)">Add</button>
            </div>
          </div>
        </div>
      </div>
    `).join('');
  }

  async function addToCart(foodId, btnEl) {
    if (!isLoggedIn()) {
      showToast('Please log in to add items to your cart.', 'error');
      setTimeout(() => window.location.href = 'login.html', 1200);
      return;
    }

    const originalText = btnEl.textContent;
    btnEl.disabled = true;
    btnEl.textContent = 'Adding…';

    try {
      await apiRequest('/cart', { method: 'POST', auth: true, body: { food_id: foodId, quantity: 1 } });
      showToast('Added to cart.', 'success');
      refreshNavCartCount();
    } catch (err) {
      showToast(err.message, 'error');
    } finally {
      btnEl.disabled = false;
      btnEl.textContent = originalText;
    }
  }

  document.getElementById('searchInput').addEventListener('input', (e) => {
    clearTimeout(searchDebounce);
    const term = e.target.value.trim();

    searchDebounce = setTimeout(() => {
      if (term.length === 0) {
        loadFoods();
      } else {
        activeCategory = null;
        renderCategoryFilters();
        searchFoods(term);
      }
    }, 350);
  });

  loadCategories();
  loadFoods();
</script>
</body>
</html>
