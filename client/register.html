<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create an Account — Mr. Chai</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<!-- ============ NAVBAR ============ -->
<nav class="navbar navbar-expand-lg chai-navbar">
  <div class="container">
    <a class="navbar-brand" href="index.html"><img src="images/logo-icon.png" alt="Mr. Chai" class="navbar-logo-img"> Mr. Chai</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain" style="border-color: rgba(255,255,255,0.3);">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMain">
      <ul class="navbar-nav me-auto ms-lg-4">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="menu.html">Menu</a></li>
      </ul>
      <ul class="navbar-nav align-items-lg-center" id="navAuthArea"></ul>
      <a href="cart.html" class="nav-link ms-lg-3">
        Cart <span class="cart-badge" id="navCartBadge" style="display:none;"></span>
      </a>
    </div>
  </div>
</nav>

<div class="container">
  <div class="auth-panel">
    <div class="text-center mb-4">
      <p class="section-eyebrow mb-2">Join Mr. Chai</p>
      <h1 class="h3">Create your account</h1>
    </div>

    <form id="registerForm">
      <div class="mb-3">
        <label class="form-label small fw-semibold">Full name</label>
        <input type="text" class="form-control chai-form-control" id="full_name" required placeholder="Your name">
      </div>
      <div class="mb-3">
        <label class="form-label small fw-semibold">Email</label>
        <input type="email" class="form-control chai-form-control" id="email" required placeholder="you@example.com">
      </div>
      <div class="mb-3">
        <label class="form-label small fw-semibold">Phone</label>
        <input type="tel" class="form-control chai-form-control" id="phone" placeholder="e.g. 0771234567">
      </div>
      <div class="mb-3">
        <label class="form-label small fw-semibold">Delivery address</label>
        <textarea class="form-control chai-form-control" id="address" rows="2" placeholder="Street, city"></textarea>
      </div>
      <div class="mb-4">
        <label class="form-label small fw-semibold">Password</label>
        <input type="password" class="form-control chai-form-control" id="password" required minlength="6" placeholder="At least 6 characters">
      </div>

      <div id="formError" class="alert alert-danger py-2 small" style="display:none;"></div>
      <button type="submit" class="btn btn-chai-primary w-100" id="registerBtn">Create account</button>
    </form>

    <p class="text-center small text-muted mt-4 mb-0">
      Already have an account? <a href="login.html">Sign in</a>
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script>
  if (isLoggedIn()) window.location.href = 'index.html';

  document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById('formError');
    const btn = document.getElementById('registerBtn');
    errorBox.style.display = 'none';

    const payload = {
      full_name: document.getElementById('full_name').value.trim(),
      email: document.getElementById('email').value.trim(),
      phone: document.getElementById('phone').value.trim(),
      address: document.getElementById('address').value.trim(),
      password: document.getElementById('password').value
    };

    btn.disabled = true;
    btn.textContent = 'Creating account…';

    try {
      await apiRequest('/auth/register', { method: 'POST', body: payload });
      showToast('Account created — please log in.', 'success');
      setTimeout(() => window.location.href = 'login.html', 900);
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Create account';
    }
  });
</script>
</body>
</html>
