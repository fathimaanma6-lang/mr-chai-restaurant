<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile — Mr. Chai</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<!-- ============ NAVBAR ============ -->
<nav class="navbar navbar-expand-lg chai-navbar">
  <div class="container">
    <a class="navbar-brand" href="index.html"><img src="images/logo-icon.png" alt="Mr. Chai" class="navbar-logo-img"> Mr. Chai</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain" style="border-color: rgba(255,255,255,0.3);">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMain">
      <ul class="navbar-nav me-auto ms-lg-4">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="menu.html">Menu</a></li>
      </ul>
      <ul class="navbar-nav align-items-lg-center" id="navAuthArea"></ul>
      <a href="cart.html" class="nav-link ms-lg-3">
        Cart <span class="cart-badge" id="navCartBadge" style="display:none;"></span>
      </a>
    </div>
  </div>
</nav>

<div class="container">
  <div class="auth-panel">
    <div class="text-center mb-4">
      <p class="section-eyebrow mb-2">Account</p>
      <h1 class="h3">My profile</h1>
    </div>

    <form id="profileForm">
      <div class="mb-3">
        <label class="form-label small fw-semibold">Full name</label>
        <input type="text" class="form-control chai-form-control" id="full_name" required>
      </div>
      <div class="mb-3">
        <label class="form-label small fw-semibold">Email</label>
        <input type="email" class="form-control chai-form-control" id="email" disabled>
        <div class="form-text">Email can't be changed here.</div>
      </div>
      <div class="mb-3">
        <label class="form-label small fw-semibold">Phone</label>
        <input type="tel" class="form-control chai-form-control" id="phone">
      </div>
      <div class="mb-4">
        <label class="form-label small fw-semibold">Delivery address</label>
        <textarea class="form-control chai-form-control" id="address" rows="2"></textarea>
      </div>

      <div id="profileError" class="alert alert-danger py-2 small" style="display:none;"></div>
      <div id="profileSuccess" class="alert alert-success py-2 small" style="display:none;"></div>
      <button type="submit" class="btn btn-chai-primary w-100" id="profileSaveBtn">Save changes</button>
    </form>

    <hr class="my-4">

    <div class="d-flex justify-content-between align-items-center">
      <div>
        <p class="small fw-semibold mb-0">Member since</p>
        <p class="small text-muted mb-0" id="memberSince">—</p>
      </div>
      <a href="orders.html" class="btn btn-chai-outline btn-sm">View order history</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script>
  requireLogin();

  async function loadProfile() {
    try {
      const data = await apiRequest('/auth/profile', { auth: true });
      const user = data.user;

      document.getElementById('full_name').value = user.full_name || '';
      document.getElementById('email').value = user.email || '';
      document.getElementById('phone').value = user.phone || '';
      document.getElementById('address').value = user.address || '';
      document.getElementById('memberSince').textContent = formatDate(user.created_at);

      // Keep the locally cached user in sync (used by the navbar greeting)
      localStorage.setItem('chai_user', JSON.stringify(user));
    } catch (err) {
      showToast(err.message, 'error');
    }
  }

  document.getElementById('profileForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById('profileError');
    const successBox = document.getElementById('profileSuccess');
    const btn = document.getElementById('profileSaveBtn');
    errorBox.style.display = 'none';
    successBox.style.display = 'none';

    const payload = {
      full_name: document.getElementById('full_name').value.trim(),
      phone: document.getElementById('phone').value.trim(),
      address: document.getElementById('address').value.trim()
    };

    btn.disabled = true;
    btn.textContent = 'Saving…';

    try {
      await apiRequest('/auth/profile', { method: 'PUT', auth: true, body: payload });
      successBox.textContent = 'Profile updated.';
      successBox.style.display = 'block';
      await loadProfile();
      renderNavAuthState(); // refresh navbar greeting with new name
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Save changes';
    }
  });

  loadProfile();
</script>
</body>
</html>
